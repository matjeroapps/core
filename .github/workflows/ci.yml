name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commerce:commerce@localhost:5432/commerce?sslmode=disable
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: gofmt -w $(find apps cmd packages modules internal -name '*.go')
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - name: Internal OpenAPI stale-spec check
        run: |
          go run ./cmd/openapi-gen
          git diff --exit-code -- docs/api

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f docker/go-app.Dockerfile --build-arg APP_PATH=./apps/workers/general-worker -t commerce-general-worker:ci .
      - run: docker build -f docker/go-app.Dockerfile --build-arg APP_PATH=./apps/workers/scheduler -t commerce-scheduler:ci .
      - run: docker build -f docker/go-app.Dockerfile --build-arg APP_PATH=./apps/core-api -t commerce-core-api:ci .
      - run: test -f migrations/000001_event_delivery_foundation.up.sql
      - run: test -f migrations/000001_event_delivery_foundation.down.sql

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go list -m all
      # gitleaks-action v3 requires a paid license for organization accounts;
      # the CLI is MIT-licensed and needs none.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks scan
        run: gitleaks detect --source . --redact --no-banner --verbose
