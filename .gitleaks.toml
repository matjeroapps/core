# Extends the default rules; synthetic tokens in committed test fixtures are
# not secrets (they are valueless strings generated by Core's test harness).
[extend]
useDefault = true

[allowlist]
description = "Cross-repo contract fixtures: synthetic, valueless tokens"
paths = [
    '''internal/coreclient/testdata/p58/.*''',
    '''internal/coreapi/merchant_console_test.go''',
]
